<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="nebula-purple" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#6C38FF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#6C38FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0D111C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebula-blue" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1B76FF" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#1B76FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#0D111C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="arena-glow" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6C38FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0D111C" stop-opacity="0" />
    </radialGradient>
    <pattern id="arena-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#252F47" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Deep Midnight Base -->
  <rect width="100%" height="100%" fill="#0D111C" />

  <!-- Grid Layer -->
  <rect width="100%" height="100%" fill="url(#arena-grid)" />

  <!-- Atmospheric Glows -->
  <rect width="100%" height="100%" fill="url(#nebula-purple)" />
  <rect width="100%" height="100%" fill="url(#nebula-blue)" />
  <rect width="100%" height="100%" fill="url(#arena-glow)" />

  <!-- Subtle Constellation Stars -->
  <circle cx="180" cy="120" r="1.5" fill="#FFFFFF" opacity="0.4" />
  <circle cx="340" cy="80" r="1" fill="#FFFFFF" opacity="0.3" />
  <circle cx="620" cy="210" r="1.2" fill="#6C38FF" opacity="0.6" />
  <circle cx="890" cy="140" r="1" fill="#FFFFFF" opacity="0.4" />
  <circle cx="1120" cy="90" r="1.8" fill="#1B76FF" opacity="0.6" />
  <circle cx="1280" cy="240" r="1.2" fill="#FFFFFF" opacity="0.3" />
  <circle cx="210" cy="480" r="1" fill="#FFFFFF" opacity="0.25" />
  <circle cx="1220" cy="560" r="1.5" fill="#FFFFFF" opacity="0.35" />
</svg>
