<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="arena-top-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161D2F" />
      <stop offset="60%" stop-color="#0D111C" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#6C38FF" stop-opacity="0.15" />
      <stop offset="85%" stop-color="#1B76FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0D111C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#arena-top-fade)" />
  <circle cx="720" cy="450" r="420" fill="url(#ring-glow)" />

  <!-- Concentric Arena Rings -->
  <circle cx="720" cy="450" r="320" fill="none" stroke="#252F47" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="720" cy="450" r="220" fill="none" stroke="#6C38FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.3" />
</svg>
