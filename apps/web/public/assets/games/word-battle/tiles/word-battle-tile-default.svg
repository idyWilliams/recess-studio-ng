<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="tile-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3A56" />
      <stop offset="100%" stop-color="#141A29" />
    </linearGradient>
    <linearGradient id="tile-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222B3F" />
      <stop offset="100%" stop-color="#182030" />
    </linearGradient>
    <filter id="tile-drop-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Tile Shadow & Beveled Base -->
  <rect x="4" y="4" width="72" height="72" rx="14" fill="url(#tile-bevel)" filter="url(#tile-drop-shadow)" />

  <!-- Tactile Raised Surface -->
  <rect x="5" y="5" width="70" height="68" rx="13" fill="url(#tile-surface)" />

  <!-- Top Specular Highlight Edge -->
  <path d="M 17 6 L 63 6" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round" />
</svg>
