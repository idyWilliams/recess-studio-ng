<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wbBgGlow" cx="200" cy="110" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C38FF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#1B76FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="swordGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Atmospheric Glow -->
  <rect width="400" height="220" rx="24" fill="#0A0E1A"/>
  <rect width="400" height="220" rx="24" fill="url(#wbBgGlow)"/>

  <!-- Cyber Grid Lines in Perspective -->
  <path d="M40 180L160 80M100 200L180 80M200 220L200 80M300 200L220 80M360 180L240 80" stroke="#6C38FF" stroke-opacity="0.15" stroke-width="1.5"/>
  <path d="M30 180C140 160 260 160 370 180M50 150C150 135 250 135 350 150M80 120C160 110 240 110 320 120" stroke="#1B76FF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Floating Glowing Letter Tiles -->
  <!-- Tile 1: 'W' (Left, angled) -->
  <g transform="translate(70, 75) rotate(-14)">
    <rect width="64" height="68" rx="14" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="3" y="3" width="58" height="62" rx="11" fill="url(#tileGrad1)" fill-opacity="0.8"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">W</text>
    <text x="49" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">4</text>
    <circle cx="32" cy="10" r="1.5" fill="#C4B5FD"/>
  </g>

  <!-- Tile 2: 'O' (Center Left) -->
  <g transform="translate(140, 55) rotate(-4)">
    <rect width="64" height="68" rx="14" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
    <rect x="3" y="3" width="58" height="62" rx="11" fill="url(#tileGrad2)" fill-opacity="0.8"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">O</text>
    <text x="49" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">1</text>
  </g>

  <!-- Tile 3: 'R' (Center Right) -->
  <g transform="translate(210, 65) rotate(8)">
    <rect width="64" height="68" rx="14" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2"/>
    <rect x="3" y="3" width="58" height="62" rx="11" fill="url(#tileGrad1)" fill-opacity="0.8"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">R</text>
    <text x="49" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">2</text>
  </g>

  <!-- Tile 4: 'D' (Right, angled) -->
  <g transform="translate(280, 80) rotate(16)">
    <rect width="64" height="68" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="3" y="3" width="58" height="62" rx="11" fill="url(#tileGrad2)" fill-opacity="0.8"/>
    <text x="32" y="44" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">D</text>
    <text x="49" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">3</text>
  </g>

  <!-- Crossed Glowing Battle Swords Motif -->
  <g transform="translate(200, 155)">
    <!-- Glow behind swords -->
    <circle cx="0" cy="0" r="28" fill="#F59E0B" fill-opacity="0.25" filter="url(#tileGlow)"/>
    <!-- Sword 1 -->
    <path d="M-28 -28 L28 28 M20 20 L28 12 M20 20 L12 28" stroke="url(#swordGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="28" r="3.5" fill="#FEF3C7"/>
    <!-- Sword 2 -->
    <path d="M28 -28 L-28 28 M-20 20 L-28 12 M-20 20 L-12 28" stroke="url(#swordGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-28" cy="28" r="3.5" fill="#FEF3C7"/>
    <!-- Center Clash Flash -->
    <polygon points="0,-8 3,-3 8,0 3,3 0,8 -3,3 -8,0 -3,-3" fill="#FFFBEB"/>
  </g>

  <!-- Sparkles & Energy Orbs -->
  <circle cx="95" cy="45" r="3" fill="#C4B5FD" fill-opacity="0.9"/>
  <circle cx="320" cy="50" r="2.5" fill="#93C5FD" fill-opacity="0.8"/>
  <circle cx="60" cy="165" r="2" fill="#FDE68A" fill-opacity="0.7"/>
  <circle cx="340" cy="155" r="3" fill="#C4B5FD" fill-opacity="0.9"/>
</svg>
