<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="whotGlow" cx="200" cy="110" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whotCardWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="whotSpecialCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="symbolGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Glow -->
  <rect width="400" height="220" rx="24" fill="#0A0808"/>
  <rect width="400" height="220" rx="24" fill="url(#whotGlow)"/>

  <!-- African Ankara Wax-Print Geometric Background Patterns -->
  <g opacity="0.12" stroke="#F59E0B" stroke-width="1.5" fill="none">
    <circle cx="200" cy="110" r="95"/>
    <circle cx="200" cy="110" r="75" stroke-dasharray="6 4"/>
    <polygon points="200,25 285,110 200,195 115,110"/>
    <polygon points="200,45 265,110 200,175 135,110"/>
  </g>

  <!-- Card Fan Display -->

  <!-- Card 1 (Left): Triangle Card -->
  <g transform="translate(60, 48) rotate(-18)" filter="url(#cardShadow)">
    <rect width="76" height="114" rx="10" fill="url(#whotCardWhite)" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="14" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#EF4444">3</text>
    <polygon points="14,29 20,40 8,40" fill="#EF4444"/>
    <!-- Big Center Triangle -->
    <polygon points="38,42 62,84 14,84" fill="#EF4444"/>
    <polygon points="38,52 54,80 22,80" fill="#FEE2E2"/>
    <text x="62" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#EF4444">3</text>
  </g>

  <!-- Card 2 (Mid-Left): Circle Card -->
  <g transform="translate(125, 32) rotate(-6)" filter="url(#cardShadow)">
    <rect width="76" height="114" rx="10" fill="url(#whotCardWhite)" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="14" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#10B981">7</text>
    <circle cx="14" cy="35" r="5" fill="#10B981"/>
    <!-- Big Center Circle -->
    <circle cx="38" cy="62" r="22" fill="#10B981"/>
    <circle cx="38" cy="62" r="14" fill="#D1FAE5"/>
    <text x="62" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#10B981">7</text>
  </g>

  <!-- Card 3 (Center Foreground): Iconic "20 WHOT!" Card -->
  <g transform="translate(180, 24) rotate(4)" filter="url(#cardShadow)">
    <rect width="82" height="122" rx="12" fill="url(#whotSpecialCard)" stroke="#FEF3C7" stroke-width="2"/>
    <!-- Card Inner Border -->
    <rect x="4" y="4" width="74" height="114" rx="8" fill="none" stroke="#78350F" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#78350F">20</text>
    <!-- Center WHOT! Emblem -->
    <circle cx="41" cy="64" r="26" fill="#78350F"/>
    <circle cx="41" cy="64" r="22" fill="#FEF3C7"/>
    <text x="41" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#78350F" text-anchor="middle">WHOT</text>
    <text x="41" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#B45309" text-anchor="middle">★ ! ★</text>
    <text x="66" y="108" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#78350F">20</text>
  </g>

  <!-- Card 4 (Right): Star Card -->
  <g transform="translate(255, 38) rotate(16)" filter="url(#cardShadow)">
    <rect width="76" height="114" rx="10" fill="url(#whotCardWhite)" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="14" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#3B82F6">5</text>
    <!-- Star Mini -->
    <polygon points="14,30 16,34 20,34 17,37 18,41 14,38 10,41 11,37 8,34 12,34" fill="#3B82F6"/>
    <!-- Big Center Star -->
    <polygon points="38,40 43,54 58,54 46,63 50,77 38,68 26,77 30,63 18,54 33,54" fill="#3B82F6"/>
    <polygon points="38,48 41,56 50,56 43,62 45,70 38,65 31,70 33,62 26,56 35,56" fill="#DBEAFE"/>
    <text x="62" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#3B82F6">5</text>
  </g>

  <!-- Floating Sparkles & Whot Rules Chips -->
  <g transform="translate(195, 180)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#78350F" fill-opacity="0.8" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FEF3C7" text-anchor="middle" letter-spacing="1">HOLD ON • PICK TWO</text>
  </g>
</svg>
