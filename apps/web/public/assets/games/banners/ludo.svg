<svg width="400" height="220" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ludoGlow" cx="200" cy="110" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="diceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <filter id="diceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Glow -->
  <rect width="400" height="220" rx="24" fill="#070913"/>
  <rect width="400" height="220" rx="24" fill="url(#ludoGlow)"/>

  <!-- Isometric Stylized Ludo Arena Board (Tilted) -->
  <g transform="translate(60, 25)">
    <!-- Main Board Base -->
    <rect x="0" y="0" width="170" height="170" rx="20" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <!-- 4 Home Quadrants -->
    <!-- Red Base (Top-Left) -->
    <rect x="10" y="10" width="60" height="60" rx="12" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="6" fill="#EF4444"/>
    <circle cx="52" cy="28" r="6" fill="#EF4444"/>
    <circle cx="28" cy="52" r="6" fill="#EF4444"/>
    <circle cx="52" cy="52" r="6" fill="#EF4444"/>

    <!-- Green Base (Top-Right) -->
    <rect x="100" y="10" width="60" height="60" rx="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="118" cy="28" r="6" fill="#10B981"/>
    <circle cx="142" cy="28" r="6" fill="#10B981"/>
    <circle cx="118" cy="52" r="6" fill="#10B981"/>
    <circle cx="142" cy="52" r="6" fill="#10B981"/>

    <!-- Yellow Base (Bottom-Left) -->
    <rect x="10" y="100" width="60" height="60" rx="12" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="28" cy="118" r="6" fill="#F59E0B"/>
    <circle cx="52" cy="118" r="6" fill="#F59E0B"/>
    <circle cx="28" cy="142" r="6" fill="#F59E0B"/>
    <circle cx="52" cy="142" r="6" fill="#F59E0B"/>

    <!-- Blue Base (Bottom-Right) -->
    <rect x="100" y="100" width="60" height="60" rx="12" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="118" cy="118" r="6" fill="#3B82F6"/>
    <circle cx="142" cy="118" r="6" fill="#3B82F6"/>
    <circle cx="118" cy="142" r="6" fill="#3B82F6"/>
    <circle cx="142" cy="142" r="6" fill="#3B82F6"/>

    <!-- Center Victory Diamond -->
    <polygon points="85,70 100,85 85,100 70,85" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="85,70 85,85 70,85" fill="#EF4444"/>
    <polygon points="85,70 100,85 85,85" fill="#10B981"/>
    <polygon points="70,85 85,85 85,100" fill="#F59E0B"/>
    <polygon points="100,85 85,100 85,85" fill="#3B82F6"/>
  </g>

  <!-- Big Floating 3D Ivory Dice Rolling a Lucky '6' -->
  <g transform="translate(255, 60) rotate(14)" filter="url(#diceShadow)">
    <!-- Motion trails -->
    <path d="M-15 35 C-35 55 -55 75 -75 85" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.6"/>
    <path d="M5 45 C-15 65 -35 85 -55 95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.5"/>

    <!-- Main Dice Cube Body -->
    <rect width="78" height="78" rx="18" fill="url(#diceGrad)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- 6 Embossed Pips (Crimson & Obsidian Luxury) -->
    <circle cx="24" cy="22" r="6" fill="#DC2626"/>
    <circle cx="24" cy="39" r="6" fill="#DC2626"/>
    <circle cx="24" cy="56" r="6" fill="#DC2626"/>
    <circle cx="54" cy="22" r="6" fill="#DC2626"/>
    <circle cx="54" cy="39" r="6" fill="#DC2626"/>
    <circle cx="54" cy="56" r="6" fill="#DC2626"/>

    <!-- Inner Pip Specular Shines -->
    <circle cx="22.5" cy="20.5" r="2" fill="#FCA5A5"/>
    <circle cx="22.5" cy="37.5" r="2" fill="#FCA5A5"/>
    <circle cx="22.5" cy="54.5" r="2" fill="#FCA5A5"/>
    <circle cx="52.5" cy="20.5" r="2" fill="#FCA5A5"/>
    <circle cx="52.5" cy="37.5" r="2" fill="#FCA5A5"/>
    <circle cx="52.5" cy="54.5" r="2" fill="#FCA5A5"/>
  </g>

  <!-- High-Roller Badge Pill -->
  <g transform="translate(295, 175)">
    <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#93C5FD" text-anchor="middle" letter-spacing="1">4 PLAYERS • 🎲 6</text>
  </g>
</svg>
